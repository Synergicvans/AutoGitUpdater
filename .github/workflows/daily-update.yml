name: AutoGitUpdater

on:
  schedule:
    - cron: '30 13 * * *' # 7:00 PM India time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autogitupdater-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Check generator
        run: node --test tests/generate-update.test.mjs
      - name: Update 1 of 3
        uses: ./.github/actions/update-example
        with:
          slot: '1'
      - name: Update 2 of 3
        uses: ./.github/actions/update-example
        with:
          slot: '2'
      - name: Update 3 of 3
        uses: ./.github/actions/update-example
        with:
          slot: '3'
